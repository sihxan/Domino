name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy --strict
      - run: uv run lint-imports
      - run: uv run pytest tests/unit

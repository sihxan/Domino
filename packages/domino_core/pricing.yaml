# API-equivalent prices and budget limits for domino_core.clients.llm (code §0.4, decisions W2-4·W2-5·T7).
# models: USD per million tokens, Claude API list prices (claude-api skill model table cached 2026-10-06;
#   check https://platform.claude.com/docs/en/about-claude/pricing before changing models).
#   cache_write = 5-minute-TTL cache write (1.25x input); cache_read = cache hit (Haiku 5.5: 0.1x input,
#   Sonnet 5.5 / Opus 5.5: published $0.20). Haiku 5.5 bills prompts over 100K tokens at a higher rate — not
#   modelled (chunks are 512 tokens).
# On the claude_code (subscription) backend these are not charges: they estimate what the API would cost and
# cap usage through the same Redis budgets.
models:
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_write: 0.125
    cache_read: 0.01
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_write: 2.50
    cache_read: 0.20
  claude-opus-5-5:
    input: 4.00
    output: 20.00
    cache_write: 5.00
    cache_read: 0.20

# Daily limits (USD) for budget-key kinds that have no Settings field (tech §5 table, decision W2-5).
# extract / judge / report come from settings.budget_extract_daily / budget_judge_daily / budget_report_run.
budgets:
  classify: 0.3
  linker: 0.5
  baseline: 0.5
  publish: 0.5
  golden: 2.0

# tech §6.4: at or above this month-to-date total, extract and classify stop until checked by hand.
monthly_cap_usd: 250

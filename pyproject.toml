[project]
name = "domino"
version = "0.0.0"
description = "Domino Phase 0 — daily insight report pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "boto3==1.43.123",
    "httpx==0.28.1",
    "kss==6.0.6",
    "neo4j==5.28.8",
    "psycopg[binary]==3.3.7",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "pysbd==0.3.4",
    "python-ulid==4.1.0",
    "pyyaml==6.0.3",
    "redis==8.1.0",
    "sqlalchemy==2.1.7",
    "structlog==26.1.0",
    "tiktoken==0.14.0",
]

[dependency-groups]
dev = [
    "import-linter==2.15",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "testcontainers==4.15.0",
    "types-pyyaml==6.0.12.20250915",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/domino_core",
    "packages/domino_ingest",
    "packages/domino_extract",
    "packages/domino_resolve",
    "packages/domino_graph",
    "packages/domino_signals",
    "packages/domino_agent",
    "packages/domino_report",
    "packages/domino_eval",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
    "domino_core",
    "domino_ingest",
    "domino_extract",
    "domino_resolve",
    "domino_graph",
    "domino_signals",
    "domino_agent",
    "domino_report",
    "domino_eval",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages"
explicit_package_bases = true
files = ["packages", "tests"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["kss", "kss.*", "pysbd", "pysbd.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "--import-mode=importlib -ra"
markers = [
    "integration: needs testcontainers (Docker)",
    "golden: real LLM calls, cost incurred",
]

[tool.importlinter]
root_packages = [
    "domino_core",
    "domino_ingest",
    "domino_extract",
    "domino_resolve",
    "domino_graph",
    "domino_signals",
    "domino_agent",
    "domino_report",
    "domino_eval",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "External I/O only via domino_core.clients (CLAUDE.md rules 4, 5)"
type = "forbidden"
source_modules = [
    "domino_ingest",
    "domino_extract",
    "domino_resolve",
    "domino_graph",
    "domino_signals",
    "domino_agent",
    "domino_report",
    "domino_eval",
]
forbidden_modules = ["anthropic", "httpx", "neo4j", "redis", "boto3", "botocore"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Dependency direction: core <- ingest <- extract <- resolve <- graph <- signals <- agent <- report <- eval"
type = "layers"
layers = [
    "domino_eval",
    "domino_report",
    "domino_agent",
    "domino_signals",
    "domino_graph",
    "domino_resolve",
    "domino_extract",
    "domino_ingest",
    "domino_core",
]
